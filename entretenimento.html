<script id="pp-v61-thin-bank-rail-script">(()=>{'use strict';const rail=document.getElementById('ppBankRailV61');if(!rail)return;const area=(document.body?.dataset?.hubArea||'financas').toLowerCase(),hub=document.getElementById('ppHubV61');const openHub=()=>{hub?.classList.add('open');hub?.setAttribute('aria-hidden','false')},closeHub=()=>{hub?.classList.remove('open');hub?.setAttribute('aria-hidden','true')};rail.querySelector('[data-v61-hub]')?.addEventListener('click',openHub);hub?.querySelector('.v61-hub-close')?.addEventListener('click',closeHub);hub?.addEventListener('click',e=>{if(e.target===hub)closeHub()});hub?.querySelector(`[data-v61-area="${area}"]`)?.classList.add('active');function active(id){rail.querySelectorAll('[data-v61-view]').forEach(b=>b.classList.toggle('active',b.dataset.v61View===id))}function openView(id){if(area==='financas'&&typeof window.showView==='function'){window.showView(id);active(id);return}const target=document.getElementById(id);if(!target)return;document.querySelectorAll('main .view').forEach(v=>v.classList.toggle('active',v.id===id));active(id);window.scrollTo({top:0,behavior:'auto'});try{history.replaceState(null,'','#'+id)}catch(_){}}rail.querySelectorAll('[data-v61-view]').forEach(b=>b.addEventListener('click',()=>openView(b.dataset.v61View)));const current=document.querySelector('main .view.active')?.id||location.hash.replace('#','');if(current)active(current);else rail.querySelector('[data-v61-view]')?.classList.add('active');rail.querySelector('[data-v61-profile]')?.addEventListener('click',()=>{const el=document.querySelector('.profile-man,#profileButton,#profileBtn,[data-profile-open]');if(el){el.click();return}location.href='index.html'});rail.querySelector('[data-v61-add]')?.addEventListener('click',()=>{if(area==='financas')document.querySelector('[data-addtx]')?.click();else location.href='index.html?action=addtx'});rail.querySelector('[data-v61-backup]')?.addEventListener('click',()=>document.getElementById('backupBtn')?.click());rail.querySelector('[data-v61-logout]')?.addEventListener('click',()=>{const el=document.getElementById('logoutBtnV57')||document.querySelector('[data-logout]');if(el){el.click();return}location.href='index.html'});})();</script>
