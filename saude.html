<script id="pp-v62-shell-script">(()=>{'use strict';const rail=document.getElementById('ppBankRailV62');if(!rail)return;const area=(document.body?.dataset?.hubArea||'financas').toLowerCase();const hub=document.getElementById('ppHubV62');const killLegacy=()=>{['v76FloatNav','v76ProfilePod','ppV57CornerMenu','ppV58BankSidebar','ppBankSidebarV58','ppBankShellV59','ppBankShellV60','ppBankRailV61'].forEach(id=>document.getElementById(id)?.remove());document.querySelectorAll('.floating-nav,.floating-menu,.hub-floating-nav').forEach(el=>el.remove());document.querySelectorAll('.topbar,header.topbar').forEach(el=>{el.hidden=true;el.style.setProperty('display','none','important')})};killLegacy();[80,350,1200].forEach(ms=>setTimeout(killLegacy,ms));const openHub=()=>{hub?.classList.add('open');hub?.setAttribute('aria-hidden','false')};const closeHub=()=>{hub?.classList.remove('open');hub?.setAttribute('aria-hidden','true')};rail.querySelector('[data-v62-hub]')?.addEventListener('click',openHub);hub?.querySelector('.v62-hub-close')?.addEventListener('click',closeHub);hub?.addEventListener('click',e=>{if(e.target===hub)closeHub()});hub?.querySelector(`[data-v62-area="${area}"]`)?.classList.add('active');const setActive=id=>rail.querySelectorAll('[data-v62-view]').forEach(b=>b.classList.toggle('active',b.dataset.v62View===id));function openView(id){if(area==='financas'&&typeof window.showView==='function'){window.showView(id);setActive(id);return}const target=document.getElementById(id);if(!target)return;document.querySelectorAll('main .view').forEach(v=>v.classList.toggle('active',v.id===id));setActive(id);window.scrollTo({top:0,behavior:'auto'});try{history.replaceState(null,'','#'+id)}catch(_){}}rail.querySelectorAll('[data-v62-view]').forEach(b=>b.addEventListener('click',()=>openView(b.dataset.v62View)));const current=document.querySelector('main .view.active')?.id||location.hash.replace('#','');if(current)setActive(current);else rail.querySelector('[data-v62-view]')?.classList.add('active');rail.querySelector('[data-v62-profile]')?.addEventListener('click',()=>{const el=document.querySelector('.profile-man,#profileButton,#profileBtn,[data-profile-open]');if(el){el.click();return}location.href='index.html'});rail.querySelector('[data-v62-add]')?.addEventListener('click',()=>{if(area==='financas'){document.querySelector('[data-addtx]')?.click()}else location.href='index.html?action=addtx'});rail.querySelector('[data-v62-backup]')?.addEventListener('click',()=>document.getElementById('backupBtn')?.click());rail.querySelector('[data-v62-logout]')?.addEventListener('click',()=>{const el=document.getElementById('logoutBtnV57')||document.querySelector('[data-logout]');if(el){el.click();return}location.href='index.html'});})();</script>
